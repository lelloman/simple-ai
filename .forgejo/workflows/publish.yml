name: Publish image

# Builds the deployable image on every push to master and pushes it to the
# homelab registry as :<short-sha> and :latest, with the same build arguments
# and labels as homelab's build-and-deploy.sh. simple-ai is digest-pinned, so
# deploying stays manual with homelab's promote.sh; nothing here touches the
# server.
# Android-only and GitHub workflow changes do not affect the image.
on:
  push:
    branches: [master]
    paths-ignore:
      - android/**
      - .github/**

env:
  REGISTRY: registry.homelab:5000
  IMAGE: simple-ai-backend
  DOCKER_VERSION: 29.1.3
  DOCKER_SHA256: c019c608ba2bb009dd673f3230e4d743f36a78d36166c6c2444c05d0aa9ff0d9
  BUILDX_VERSION: v0.37.1
  BUILDX_SHA256: 9447199cdb435f25880548343c128a4b6650e8891ee598905d8d29d39a8e359b

jobs:
  publish:
    name: Publish image
    # halo1 only: halo2 also hosts the model server.
    runs-on: fucina-build
    timeout-minutes: 60
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6

      - name: Install Docker client
        run: |
          set -eu
          curl -fsSLo /tmp/docker.tgz \
            "https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz"
          echo "${DOCKER_SHA256}  /tmp/docker.tgz" | sha256sum -c -
          tar -xzf /tmp/docker.tgz -C /usr/local/bin --strip-components=1 docker/docker
          plugins=/usr/local/lib/docker/cli-plugins
          mkdir -p "$plugins"
          curl -fsSLo "$plugins/docker-buildx" \
            "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64"
          echo "${BUILDX_SHA256}  $plugins/docker-buildx" | sha256sum -c -
          chmod 0755 "$plugins/docker-buildx"
          docker version --format 'client {{.Client.Version}}, daemon {{.Server.Version}}'

      - name: Build image
        run: |
          set -eu
          rev=$(git rev-parse --short HEAD)
          echo "REV=$rev" >> "$GITHUB_ENV"
          docker build \
            -t "$REGISTRY/$IMAGE:$rev" -t "$REGISTRY/$IMAGE:latest" \
            --label "org.opencontainers.image.revision=$rev" \
            --label "org.opencontainers.image.ref.name=master" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f backend/Dockerfile .

      - name: Push image
        run: |
          set -eu
          docker push -q "$REGISTRY/$IMAGE:$REV"
          # Move latest only if this commit is still the tip of master, so a
          # slower older run cannot roll latest back.
          git fetch -q --depth=1 origin master
          if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ]; then
            docker push -q "$REGISTRY/$IMAGE:latest"
          else
            echo "master has moved on; leaving latest alone"
          fi
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE:$REV")
          echo "Published $digest"
