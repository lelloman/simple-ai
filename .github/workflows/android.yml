name: Android checks

on:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.96.0
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK and native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973'
          rustup toolchain install 1.96.0 --profile minimal
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests, lint and instrumentation compilation
        working-directory: android
        run: ./scripts/check
      - name: Upload reports and test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-results
          retention-days: 14
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/apk/androidTest/
