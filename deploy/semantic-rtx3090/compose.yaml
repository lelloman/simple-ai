# JEV-9B replaces the retired Qwen/SGLang semantic experiment.
# Reuses the installed vLLM runtime; see README for the pinned image identity.
name: jev-rtx3090
x-runtime: &runtime
  image: ${JEV_RUNTIME_IMAGE:-simple-ai-jev:20260929}
  environment:
    HF_HOME: /models/hf
    HF_HUB_ENABLE_HF_TRANSFER: "0"
    HF_HUB_OFFLINE: "1"
    VLLM_NO_USAGE_STATS: "1"
    VLLM_SERVER_DEV_MODE: ${JEV_BENCHMARK_MODE:-0}
  volumes:
    - models:/models
    - ../../scripts:/work/scripts:ro
    - ../../tests/fixtures:/work/tests/fixtures:ro
services:
  vllm:
    <<: *runtime
    runtime: nvidia
    gpus: all
    shm_size: 8gb
    ports:
      - "127.0.0.1:30000:30000"
    entrypoint: ["/app/venv/bin/vllm", "serve"]
    command:
      - /models/hf/hub/models--autotrust--JEV-9B/snapshots/4ab5dfb9331c4eb3a212742e1a1aa5446c1fda35
      - --served-model-name
      - autotrust/JEV-9B
      - --host
      - 0.0.0.0
      - --port
      - "30000"
      - --dtype
      - bfloat16
      - --enable-lora
      - --max-lora-rank
      - "32"
      - --lora-modules
      - jev-decision=/models/hf/hub/models--autotrust--JEV-9B/snapshots/4ab5dfb9331c4eb3a212742e1a1aa5446c1fda35/adapter_vllm
      - --logprobs-mode
      - processed_logprobs
      - --max-model-len
      - "18432"
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "2048"
      - --enable-prompt-tokens-details
      - --enable-prefix-caching
      - --mamba-cache-mode
      - align
      - --enforce-eager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30000/health"]
      interval: 10s
      timeout: 5s
      retries: 120
  provider:
    <<: *runtime
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "127.0.0.1:18040:18040"
    entrypoint: ["/app/venv/bin/python", "/work/scripts/simple_ai_semantic.py"]
    command: ["--backend", "http://vllm:30000", "--host", "0.0.0.0", "--context", "18432", "--concurrency", "2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18040/health"]
      interval: 15s
      timeout: 10s
      retries: 5
volumes:
  models:
    name: jev-rtx3090_models
    external: true
