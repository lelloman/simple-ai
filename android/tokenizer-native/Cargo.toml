[package]
name = "simpleai-tokenizer"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
serde_json = "1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[profile.release]
lto = true
strip = true
